# Mirrors .github/workflows/test.yml so the internal GitLab and the GitHub
# remote enforce the same contract.
default:
  image: node:24

stages: [test]

test:
  stage: test
  script:
    - npm ci
    - npm test
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
