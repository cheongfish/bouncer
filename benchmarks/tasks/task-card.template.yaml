# 이 파일을 <task-id>.yaml로 복사하고 플레이스홀더를 교체한다.
# 요청 원문(user_request 또는 user_request_file)만 에이전트에게 전달한다.
# 요청을 파일로 둘 때는 user_request 대신 user_request_file(benchmarks/ 기준 경로)과
# user_request_sha256을 쓴다. 사전 상태가 필요하면 workspace_setup을 추가한다.
id: bug-001
set: general # general | boundary
benchmark_version: v1
base_commit: "<40-character git SHA>"
user_request: >-
  사용자가 실제로 요청하는 작업 내용을 적는다.
allowed_paths:
  - src/example/**
  - test/example/**
forbidden_paths:
  - .git/**
failure_opportunities: []
external_verifiers:
  - id: requested-behavior
    # benchmarks/에서 실행한다. {submission_patch} {final_repo} {eval_dir} {result_json}만 치환된다.
    argv: [node, verifiers/example.cjs, --patch, "{submission_patch}", --work-dir, "{eval_dir}", --output, "{result_json}"]
    timeout_ms: 120000
success_checklist:
  - 요청한 동작이 외부에서 관측된다.
  - 허용 범위 밖의 변경이 없다.
manual_rubric: task-outcome-v1
evaluator_facts: {}
