name: test

on:
  push:
    branches: [main, develop]
  pull_request:

# ubuntu-latest only: on private repositories Actions minutes are billed at
# 1x for Linux, 2x for Windows, and 10x for macOS.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Plugins are consumed as a clone with no build step, so the committed
      # tsc emit is what ships. npm test rebuilds it, which would hide a stale
      # commit; check the emit before anything else regenerates it.
      - name: scripts/lib matches scripts/src/lib
        run: |
          npm run build
          git add --intent-to-add scripts/lib
          git diff --exit-code -- scripts/lib
      - run: npm test
      - run: npm run lint
