name: release

on:
  push:
    tags:
      - 'bouncer--v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/sync-versions.js --check
      - run: npm run ci
      - run: npm pack --workspace=@cheongfish/bouncer --dry-run --json
      - run: npm pack --dry-run --json
      - name: Build plugin tree
        run: node scripts/build-release.js --out "$RUNNER_TEMP/plugin-tree"
      - name: Pack runtime artifact
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-artifact"
          npm pack --workspace=@cheongfish/bouncer --json \
            --pack-destination "$RUNNER_TEMP/runtime-artifact" > "$RUNNER_TEMP/runtime-artifact/metadata.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-inputs
          path: |
            ${{ runner.temp }}/runtime-artifact
            ${{ runner.temp }}/plugin-tree
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bouncer--v')
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require OIDC capable npm
        run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: ${{ runner.temp }}/release-inputs
      - name: Verify tag and publish in order
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_ROOT: ${{ github.workspace }}
          INPUT_DIR: ${{ runner.temp }}/release-inputs
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF#refs/tags/bouncer--v}"
          root_version="$(node -p 'require("./packages/cli/package.json").version')"
          pack_version="$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))[0];process.stdout.write(p.version)' "$INPUT_DIR/runtime-artifact/metadata.json")"
          plugin_version="$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(p.version)' "$INPUT_DIR/plugin-tree/package.json")"
          test "$tag_version" = "$root_version"
          test "$tag_version" = "$pack_version"
          test "$tag_version" = "$plugin_version"
          tarball="$(find "$INPUT_DIR/runtime-artifact" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          node scripts/release-runtime.js --publish --tarball "$tarball" \
            --metadata "$INPUT_DIR/runtime-artifact/metadata.json" \
            --plugin-tree "$INPUT_DIR/plugin-tree"
